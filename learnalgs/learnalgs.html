<style>
  :root{
    --bg-base:#101218;
    --bg-surface:#181B24;
    --ink:#F2F1ED;
    --ink-muted:#9297A6;
    --cube-red:#E8412B;
    --cube-yellow:#F2B705;
    --cube-blue:#2F6FE0;
    --cube-green:#22A35C;
  }
  body{ font-family:'Inter', sans-serif; scroll-behavior:smooth; background:var(--bg-base); color:var(--ink); }
  .font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-muted); }
  .surface-card{ background:var(--bg-surface); border:1px solid rgba(255,255,255,0.06); }
  .accent-border-red{ border-left:3px solid var(--cube-red); }
  .accent-border-yellow{ border-left:3px solid var(--cube-yellow); }
  .accent-border-blue{ border-left:3px solid var(--cube-blue); }
  .accent-border-green{ border-left:3px solid var(--cube-green); }
  .interactive-card{ position:relative; transition:transform .2s ease, box-shadow .2s ease; }
  .interactive-card:hover{ transform:translateY(-3px); box-shadow:0 14px 28px rgba(0,0,0,0.3); }
  @media (prefers-reduced-motion: reduce){ .interactive-card:hover{ transform:none; } }
  .btn-primary{ background:var(--cube-red); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.08); }
  ::selection{ background:var(--cube-yellow); color:#101218; }
  section[id]{ scroll-margin-top: 80px; }

  .tab-btn{ font-family:'JetBrains Mono', monospace; font-size:0.85rem; padding:0.6rem 1.1rem; border-radius:9999px; transition:all .2s ease; border:1px solid rgba(255,255,255,0.1); color:var(--ink-muted); background:var(--bg-surface); cursor:pointer; }
  .tab-btn.active{ background:var(--cube-red); color:#fff; border-color:var(--cube-red); }
  .subtab-btn{ font-family:'Inter',sans-serif; font-size:0.85rem; font-weight:600; padding:0.5rem 1rem; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.08); color:var(--ink-muted); background:transparent; cursor:pointer; transition:all .2s ease; }
  .subtab-btn.active{ background:rgba(232,65,43,0.12); color:var(--cube-yellow); border-color:var(--cube-yellow); }
  .alg-card{ background:var(--bg-base); border:1px solid rgba(255,255,255,0.07); border-radius:0.9rem; padding:1rem 1.1rem; cursor:pointer; }
  .alg-card:active{ transform:scale(0.98); }
  .alg-copied{ color:var(--cube-green) !important; }
  .soon-badge{ font-family:'JetBrains Mono', monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.2rem 0.6rem; border-radius:9999px; background:rgba(242,183,5,0.15); color:var(--cube-yellow); }

        "cases": [
          { "case": "Adjacent Parity", "alg": "/ -3,0 / 0,3 / 0,-3 / 0,3 / 2,0 / 0,2 / -2,0 / 4,0 / 0,-2 / 0,2 / -1,4 / 0,-3 / 0,3" },
          { "case": "Opposite Parity", "alg": "/ 3,3 / -1,0 / 2,-4 / 4,-2 / 0,-2 / -4,2 / 1,-5 / 3,0 / 3,3 / 3,0" },
          { "case": "O+ Parity", "alg": "0,-1 / -2,-2 / 2,0 / -3,-3 / 0,1 / -2,-2 / 0,-2 / 2,2 / 0,-1 / 3,3 / 3,3" },
          { "case": "O- Parity", "alg": "/ -3,-3 / 0,1 / -2,-2 / 0,2 / 2,2 / 0,-1 / 3,3 / -2,0 / 2,2 / -3,-2" },
          { "case": "W Parity", "alg": "0,-1 / 1,-2 / -4,0 / 0,3 / 1,0 / 3,-2 / -4,0 / -4,0 / -2,2 / -1,0 / 0,-3 / -3,0" }
        ]
      },
      {
        "name": "Edge Orientation (EO) — full set",
        "status": "ready",
        "note": "Step 2 — orient all edges. 7 cases.",
        "cases": [
          { "case": "EO 01", "alg": "(1,0) / (3,0) / (3,0) / (-1,-1) / (-2,1) / (-3,0)" },
          { "case": "EO 02", "alg": "(1,0) / (3,0) / (-1,-1) / (-3,0) / (0,1)" },
          { "case": "EO 03", "alg": "(1,0) / (-1,-1) / (0,1)" },
          { "case": "EO 04", "alg": "(1,0) / (-1,-1) / (3,3) / (1,1) / (-1,0)" },
          { "case": "EO 05", "alg": "(0,-1) / (0,-3) / (0,-3) / (1,1) / (-1,2) / (1,4) / (-1,0)" },
          { "case": "EO 06", "alg": "(1,0) / (3,0) / (3,0) / (-1,-1) / (-2,1) / (-4,-1) / (1,0)" },
          { "case": "EO 07", "alg": "(0,-1) / (3,0) / (3,0) / (1,1) / (-3,0) / (-3,0)" }
        ]
      },
      {
        "name": "Corner Orientation (CO) — full set",
        "status": "ready",
        "note": "Step 3 — orient all corners. 7 cases with published algs (an 8th mirror case exists but has no published text alg).",
        "cases": [
          { "case": "CO 01", "alg": "(1,0) / (3,0) / (-1,0)" },
          { "case": "CO 02", "alg": "(1,0) / (3,6) / (-1,0)" },
          { "case": "CO 03", "alg": "(1,0) / (-1,0)" },
          { "case": "CO 04", "alg": "(1,0) / (3,3) / (-1,0)" },
          { "case": "CO 05", "alg": "(1,0) / (0,3) / (0,3) / (-1,0)" },
          { "case": "CO 06", "alg": "(1,0) / (3,0) / (3,0) / (-1,0)" },
          { "case": "CO 07", "alg": "/ (6,6) / (-1,1)" }
        ]
      },
      {
        "name": "Corner Permutation (CP) — full set",
        "status": "ready",
        "note": "Step 4 — permute the corners into place. 8 cases.",
        "cases": [
          { "case": "CP 01", "alg": "/ (3,0) / (-3,-3) / (0,3) /" },
          { "case": "CP 02", "alg": "/ (3,-3) / (-3,3) /" },
          { "case": "CP 03", "alg": "/ (3,-3) / (-3,0) / (0,3) / (0,-3) / (0,3) /" },
          { "case": "CP 04", "alg": "/ (3,-3) / (0,3) / (-3,0) / (3,0) / (-3,0) /" },
          { "case": "CP 05", "alg": "/ (0,3) / (0,-3) / (0,3) / (0,-3) /" },
          { "case": "CP 06", "alg": "/ (3,0) / (-3,0) / (3,0) / (-3,0) /" },
          { "case": "CP 07", "alg": "/ (-3,-3) / (3,0) / (-3,-3) / (3,0) / (-3,-3) /" },
          { "case": "CP 08", "alg": "/ (-3,-3) / (0,-3) / (-3,-3) / (0,-3) / (-3,-3) /" }
        ]
      },
      {
        "name": "Edge Permutation (EP) — full set",
        "status": "ready",
        "note": "Step 5 (final) — permute the edges to finish the solve. 6 cases plus the parity alg already shown above.",
        "cases": [
          { "case": "EP 01", "alg": "(1,0) / (0,3) / (-1,-1) / (1,-2) / (-1,0)" },
          { "case": "EP 04", "alg": "(1,0) / (-1,-1) / (-3,0) / (1,1) / (3,0) / (-1,-1) / (0,1)" },
          { "case": "EP 05", "alg": "(1,0) / (-1,-1) / (-3,0) / (1,1) / (6,0) / (-1,-1) / (-3,0) / (1,1) / (-1,0)" },
          { "case": "EP 06", "alg": "(0,-1) / (1,0) / (3,0) / (0,-5) / (0,5) / (-3,0) / (-1,0) / (0,-5)" },
          { "case": "EP 07", "alg": "(1,0) / (0,-1) / (0,-3) / (5,0) / (-5,0) / (0,3) / (0,1) / (5,0)" }
        ]
      }
    ]
  }
};

  const ACCENTS = ["accent-border-red","accent-border-yellow","accent-border-blue","accent-border-green"];

  const eventTabsEl = document.getElementById("event-tabs");
  const subtabWrapEl = document.getElementById("subtab-wrap");
  const contentEl = document.getElementById("algs-content");

  let activeEvent = "2x2";
  let activeGroupIdx = 0;

  function renderEventTabs() {
    eventTabsEl.innerHTML = Object.keys(ALGS).map(key => `
      <button type="button" class="tab-btn ${key === activeEvent ? "active" : ""}" data-event="${key}">${ALGS[key].label}</button>
    `).join("");
    eventTabsEl.querySelectorAll("[data-event]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeEvent = btn.dataset.event;
        activeGroupIdx = 0;
        renderEventTabs();
        renderSubtabs();
        renderGroup();
      });
    });
  }

  function renderSubtabs() {
    const groups = ALGS[activeEvent].groups;
    subtabWrapEl.innerHTML = groups.map((g, i) => `
      <button type="button" class="subtab-btn ${i === activeGroupIdx ? "active" : ""}" data-idx="${i}">
        ${g.name}${g.status === "soon" ? " • soon" : ""}
      </button>
    `).join("");
    subtabWrapEl.querySelectorAll("[data-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeGroupIdx = parseInt(btn.dataset.idx, 10);
        renderSubtabs();
        renderGroup();
      });
    });
  }

  function copyAlg(text, cardEl) {
    if (!navigator.clipboard || !navigator.clipboard.writeText) return;
    navigator.clipboard.writeText(text).then(() => {
      const label = cardEl.querySelector(".copy-label");
      if (!label) return;
      const original = label.textContent;
      label.textContent = "Copied!";
      label.classList.add("alg-copied");
      setTimeout(() => { label.textContent = original; label.classList.remove("alg-copied"); }, 1200);
    }).catch(() => {});
  }

  function renderGroup() {
    const group = ALGS[activeEvent].groups[activeGroupIdx];

    if (group.status === "soon") {
      contentEl.innerHTML = `
        <div class="interactive-card surface-card accent-border-yellow rounded-2xl p-8 text-center">
          <span class="soon-badge">Coming Soon</span>
          <h3 class="font-display text-2xl font-bold mt-4 mb-3">${group.name}</h3>
          <p class="max-w-xl mx-auto mb-6" style="color:var(--ink-muted);">${group.note || "This set is on its way — we're double-checking every case before publishing it here."}</p>
        </div>`;
      return;
    }

    const noteHtml = group.note ? `<p class="text-center mb-6" style="color:var(--ink-muted);">${group.note}</p>` : "";
    const cardsHtml = group.cases.map((c, i) => `
      <div class="interactive-card alg-card ${ACCENTS[i % ACCENTS.length]}" onclick="copyAlg(${JSON.stringify(c.alg)}, this)">
        <p class="font-display font-bold text-sm mb-2" style="color:var(--cube-yellow);">${c.case}</p>
        <p class="font-mono text-base leading-relaxed break-words">${c.alg}</p>
        <p class="copy-label text-xs mt-2" style="color:var(--ink-muted);">Tap to copy</p>
      </div>`).join("");

    contentEl.innerHTML = `
      ${noteHtml}
      <div class="grid sm:grid-cols-2 gap-4">${cardsHtml}</div>`;
  }

  renderEventTabs();
  renderSubtabs();
  renderGroup();
</script>

</body>
</html>
