<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Results — Twist & Turn</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html" title="All competitions">←</a>
  <a class="icon-btn" id="peopleBtn" title="Competitors">👥</a>
  <a class="icon-btn" id="scheduleBtn" href="#" title="Full schedule">📋</a>
  <h1 id="compTitle">Loading…</h1>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="empty-state" style="padding:2rem 1rem;"><span class="spinner"></span></div>
  </div>
  <div class="content" id="content">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
</div>

<script type="module">
  import { loadSheet } from "./assets/sheets.js";
  import { EVENTS, qs } from "./assets/common.js";

  const compId = qs("id");
  const eventFilter = qs("event");
  const roundParam = qs("round");
  const sidebarEl = document.getElementById("sidebar");
  const contentEl = document.getElementById("content");
  const compTitleEl = document.getElementById("compTitle");

  document.getElementById("peopleBtn").href = `competitors.html?id=${compId}`;
  document.getElementById("scheduleBtn").addEventListener("click", (e) => {
    e.preventDefault();
    window.location.href = `competition.html?id=${compId}`;
  });

  if (roundParam && eventFilter) {
    window.location.href = `results.html?id=${compId}&event=${eventFilter}&round=${roundParam}`;
  } else if (!compId) {
    compTitleEl.textContent = "No competition selected";
    contentEl.innerHTML = `<div class="empty-state">Missing competition id.</div>`;
  } else {
    init();
  }

  async function init() {
    let competitions, events, rounds;
    try {
      [competitions, events, rounds] = await Promise.all([
        loadSheet("Competitions"), loadSheet("Events"), loadSheet("Rounds")
      ]);
    } catch (err) {
      contentEl.innerHTML = `<div class="empty-state">${err.message}</div>`;
      return;
    }
    const comp = competitions.find(c => c.id === compId);
    if (!comp) {
      compTitleEl.textContent = "Not found";
      contentEl.innerHTML = `<div class="empty-state">This competition doesn't exist in the sheet.</div>`;
      return;
    }
    compTitleEl.textContent = comp.name || "Competition";
    document.title = `${comp.name} — Live Results`;

    const compEvents = events.filter(e => e.compId === compId).sort((a, b) => (+a.order || 0) - (+b.order || 0));
    const compRounds = rounds.filter(r => r.compId === compId);

    renderSidebar(compEvents);
    if (eventFilter) {
      renderEventRounds(compEvents, compRounds, eventFilter);
    } else {
      renderFullSchedule(comp, compEvents, compRounds);
    }
  }

  function renderSidebar(compEvents) {
    if (!compEvents.length) {
      sidebarEl.innerHTML = `<div style="padding:1rem; color:var(--ink-muted); font-size:.85rem;">No events added yet.</div>`;
      return;
    }
    sidebarEl.innerHTML = "";
    compEvents.forEach(ev => {
      const meta = EVENTS[ev.eventId] || { short: ev.eventId, name: ev.eventId };
      const a = document.createElement("a");
      a.className = "event-link" + (eventFilter === ev.eventId ? " active" : "");
      a.href = `competition.html?id=${compId}&event=${ev.eventId}`;
      a.innerHTML = `<span class="evt-badge">${meta.short}</span><span>${ev.name || meta.name}</span>`;
      sidebarEl.appendChild(a);
    });
  }

  function renderFullSchedule(comp, compEvents, compRounds) {
    contentEl.innerHTML = `
      <p class="eyebrow">Welcome to</p>
      <h2 class="font-display" style="font-size:1.5rem; font-weight:700; margin:.2rem 0 1.5rem;">${comp.name}</h2>
      <div id="scheduleWrap"></div>
    `;
    const eventNameById = {};
    compEvents.forEach(ev => eventNameById[ev.eventId] = ev.name || (EVENTS[ev.eventId] || {}).name || ev.eventId);
    const rounds = compRounds.map(r => ({ ...r, eventName: eventNameById[r.eventId] || r.eventId }));
    renderScheduleGrid(rounds, document.getElementById("scheduleWrap"));
  }

  function renderEventRounds(compEvents, compRounds, eventId) {
    const ev = compEvents.find(e => e.eventId === eventId);
    const meta = EVENTS[eventId] || { name: eventId };
    const evName = ev ? (ev.name || meta.name) : meta.name;
    contentEl.innerHTML = `
      <p class="eyebrow">Event</p>
      <h2 class="font-display" style="font-size:1.5rem; font-weight:700; margin:.2rem 0 1.5rem;">${evName}</h2>
      <div id="scheduleWrap"></div>
    `;
    const rounds = compRounds.filter(r => r.eventId === eventId)
      .sort((a, b) => (+a.order || 0) - (+b.order || 0))
      .map(r => ({ ...r, eventName: evName }));
    renderScheduleGrid(rounds, document.getElementById("scheduleWrap"));
  }

  function renderScheduleGrid(rounds, wrap) {
    if (!rounds.length) {
      wrap.innerHTML = `<div class="empty-state">No schedule added yet.</div>`;
      return;
    }
    const byDate = {};
    rounds.forEach(r => {
      const key = r.scheduledDate || "Unscheduled";
      (byDate[key] = byDate[key] || []).push(r);
    });
    const dates = Object.keys(byDate).sort();
    wrap.innerHTML = "";

    const tabs = document.createElement("div");
    tabs.className = "day-tabs";
    const gridWrap = document.createElement("div");

    dates.forEach((d, i) => {
      const btn = document.createElement("button");
      btn.textContent = d === "Unscheduled" ? "Unscheduled" : new Date(d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      btn.className = i === 0 ? "active" : "";
      btn.addEventListener("click", () => {
        tabs.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        drawGrid(byDate[d]);
      });
      tabs.appendChild(btn);
    });

    function drawGrid(list) {
      list.sort((a, b) => (a.startTime || "").localeCompare(b.startTime || ""));
      gridWrap.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "schedule-grid";
      list.forEach(r => {
        const card = document.createElement("a");
        card.href = `competition.html?id=${compId}&event=${r.eventId}&round=${r.roundId}`;
        card.className = "schedule-card";
        card.style.display = "block";
        card.innerHTML = `
          <div class="t">${r.eventName} — ${r.name || "Round"}</div>
          <div class="time">${r.startTime || ""}${r.endTime ? " - " + r.endTime : ""}</div>`;
        grid.appendChild(card);
      });
      gridWrap.appendChild(grid);
    }

    wrap.appendChild(tabs);
    wrap.appendChild(gridWrap);
    drawGrid(byDate[dates[0]]);
  }
</script>
</body>
</html>
