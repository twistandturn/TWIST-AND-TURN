<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Results | Twist & Turn</title>
<meta name="theme-color" content="#E8412B">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#101218;
    --bg-surface:#181B24;
    --ink:#F2F1ED;
    --ink-muted:#9297A6;
    --cube-red:#E8412B;
    --cube-yellow:#F2B705;
    --cube-blue:#2F6FE0;
    --cube-green:#22A35C;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter', sans-serif; background:var(--bg-base); color:var(--ink); min-height:100vh; }
  .font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }

  header{ position:sticky; top:0; z-index:10; background:rgba(16,18,24,0.9); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,0.06); }
  .header-inner{ max-width:900px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); }
  .brand img{ height:34px; width:34px; border-radius:9999px; padding:2px; background:rgba(255,255,255,0.9); }
  .brand span{ font-weight:700; font-size:1.05rem; }
  .back-link{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-muted); text-decoration:none; }
  .back-link:hover{ color:var(--ink); }

  main{ max-width:900px; margin:0 auto; padding:32px 20px 60px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-muted); margin:0 0 8px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:2rem; margin:0 0 8px; }

  .badge-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  #live-results-badge{ display:none; font-family:'JetBrains Mono', monospace; font-size:0.75rem; padding:4px 12px; border-radius:9999px; background:rgba(232,65,43,0.15); color:var(--cube-red); }
  #live-results-badge.show{ display:inline-block; }
  #last-updated{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--ink-muted); }

  #live-event-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .live-tab-btn{ font-family:'JetBrains Mono', monospace; font-size:0.85rem; padding:8px 16px; border-radius:9999px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-surface); color:var(--ink-muted); cursor:pointer; transition:background .2s ease, color .2s ease; }
  .live-tab-btn.active{ background:var(--cube-red); color:#fff; border-color:var(--cube-red); }

  #live-round-tabs{ display:none; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .live-round-btn{ font-family:'JetBrains Mono', monospace; font-size:0.78rem; padding:6px 14px; border-radius:9999px; border:1px solid rgba(255,255,255,0.12); background:transparent; color:var(--ink-muted); cursor:pointer; transition:background .2s ease, color .2s ease; }
  .live-round-btn.active{ background:var(--cube-blue); color:#fff; border-color:var(--cube-blue); }

  #live-results-wrap{ background:var(--bg-surface); border:1px solid rgba(255,255,255,0.06); border-radius:16px; overflow:hidden; box-shadow:0 18px 35px rgba(0,0,0,0.25); }
  .live-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.05); }
  .live-row:last-child{ border-bottom:none; }
  .live-row.top3{ background:rgba(255,255,255,0.03); }
  .live-row.advancing-yellow{ background:rgba(242,183,5,0.10); }
  .live-row.advancing-yellow .rank{ border-left:3px solid var(--cube-yellow); }
  .live-row.advancing-green{ background:rgba(34,163,92,0.12); }
  .live-row.advancing-green .rank{ border-left:3px solid var(--cube-green); }
  .rank{ font-family:'JetBrains Mono', monospace; width:32px; text-align:center; color:var(--ink-muted); padding-left:6px; margin-left:-6px; border-left:3px solid transparent; }
  .rank.medal{ font-size:1.25rem; }
  .name{ font-weight:600; margin-left:14px; }
  .left-part{ display:flex; align-items:center; flex-wrap:wrap; row-gap:4px; }
  .time{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:1.1rem; color:var(--cube-yellow); white-space:nowrap; }
  .empty-state{ padding:40px 20px; text-align:center; color:var(--ink-muted); }

  .advance-tag{ font-family:'JetBrains Mono', monospace; font-size:0.62rem; padding:3px 9px; border-radius:9999px; margin-left:10px; text-transform:uppercase; letter-spacing:0.06em; }
  .advance-tag-yellow{ background:rgba(242,183,5,0.18); color:var(--cube-yellow); }
  .advance-tag-green{ background:rgba(34,163,92,0.2); color:var(--cube-green); }

  footer{ text-align:center; padding:24px; font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--ink-muted); border-top:1px solid rgba(255,255,255,0.06); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="../index.html">
      <img src="../logo.png.jpeg" alt="Logo" onerror="this.onerror=null;this.src='https://placehold.co/40x40/101218/F2B705?text=T%26T';">
      <span class="font-display">Twist &amp; Turn</span>
    </a>
    <a class="back-link" href="../index.html">← Back to Site</a>
  </div>
</header>

<main>
  <p class="eyebrow">Right Now</p>
  <h1>Live Results</h1>
  <div class="badge-row">
    <span id="live-results-badge">🔴 LIVE</span>
    <span id="last-updated"></span>
  </div>

  <div id="live-event-tabs"></div>
  <div id="live-round-tabs"></div>

  <div id="live-results-wrap">
    <p class="empty-state">Waiting for results…</p>
  </div>
</main>

<footer>© 2026 Twist &amp; Turn — Speedcubing Arena</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "../firebase-config.js";

  const liveApp = initializeApp(firebaseConfig, "liveResultsPageApp");
  const liveDb = getFirestore(liveApp);
  const tabsEl = document.getElementById("live-event-tabs");
  const roundTabsEl = document.getElementById("live-round-tabs");
  const liveWrap = document.getElementById("live-results-wrap");
  const liveBadgeEl = document.getElementById("live-results-badge");
  const lastUpdatedEl = document.getElementById("last-updated");

  let activeEventIdx = 0;
  let activeRoundIdx = 0;

  // Decide who's highlighted yellow/green for a given round.
  // Finals-type rounds -> top 3. Everything else -> top 8.
  // Yellow = provisional (not everyone in this round has a time yet).
  // Green  = confirmed (every participant in this round has a time).
  // A row "has a result" if it has a numeric time OR a recorded non-time
  // outcome like DNF/DNS (shown via timeDisplay). Only a row with nothing
  // entered at all (no timeMs and no timeDisplay) counts as "not yet done".
  function hasResult(r) {
    if (r.timeMs !== null && r.timeMs !== undefined) return true;
    return !!(r.timeDisplay && r.timeDisplay.trim());
  }

  function computeHighlights(rows, roundName) {
    const isFinal = /final/i.test(roundName || "");
    const cutoff = isFinal ? 3 : 8;
    // DNF/DNS (no timeMs) sort to the bottom, same as before.
    const sorted = [...(rows || [])].sort((a, b) => (a.timeMs ?? Infinity) - (b.timeMs ?? Infinity));
    const hasAnyResult = sorted.some(hasResult);
    const allHaveResults = sorted.length > 0 && sorted.every(hasResult);
    return sorted.map((r, i) => {
      let highlight = null;
      if (hasAnyResult && i < cutoff && hasResult(r)) {
        highlight = allHaveResults ? "green" : "yellow";
      }
      return { ...r, highlight };
    });
  }

  function renderRound(event) {
    const rounds = event.rounds || [];
    if (rounds.length === 0) {
      liveWrap.innerHTML = `<p class="empty-state">Waiting for results…</p>`;
      return;
    }
    if (activeRoundIdx >= rounds.length) activeRoundIdx = 0;
    const round = rounds[activeRoundIdx];
    const rows = computeHighlights(round.rows, round.name);
    const medals = ["🥇", "🥈", "🥉"];

    if (rows.length === 0) {
      liveWrap.innerHTML = `<p class="empty-state">Waiting for results…</p>`;
      return;
    }

    liveWrap.innerHTML = rows.map((r, i) => {
      const highlightClass = r.highlight === "green" ? "advancing-green" : (r.highlight === "yellow" ? "advancing-yellow" : "");
      const tag = r.highlight === "green"
        ? '<span class="advance-tag advance-tag-green">Advancing ✓</span>'
        : (r.highlight === "yellow" ? '<span class="advance-tag advance-tag-yellow">Next Round</span>' : "");
      return `
      <div class="live-row ${i < 3 ? 'top3' : ''} ${highlightClass}">
        <div class="left-part">
          <span class="rank ${i < 3 ? 'medal' : ''}">${medals[i] || (i + 1)}</span>
          <span class="name">${r.name || ""}</span>
          ${tag}
        </div>
        <span class="time">${r.timeDisplay || ""}</span>
      </div>
    `;
    }).join("");
  }

  function renderRoundTabs(event) {
    const rounds = event.rounds || [];
    if (rounds.length <= 1) {
      roundTabsEl.innerHTML = "";
      roundTabsEl.style.display = "none";
      return;
    }
    roundTabsEl.style.display = "flex";
    roundTabsEl.innerHTML = rounds.map((rd, i) => `
      <button type="button" data-idx="${i}" class="live-round-btn ${i === activeRoundIdx ? 'active' : ''}">
        ${rd.name || "Round"}
      </button>`).join("");

    roundTabsEl.querySelectorAll(".live-round-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeRoundIdx = parseInt(btn.dataset.idx, 10);
        renderRoundTabs(event);
        renderRound(event);
      });
    });
  }

  function renderEvent(events) {
    if (activeEventIdx >= events.length) activeEventIdx = 0;
    const ev = events[activeEventIdx];
    activeRoundIdx = 0;
    renderRoundTabs(ev);
    renderRound(ev);
  }

  function renderTabs(events) {
    tabsEl.innerHTML = events.map((ev, i) => `
      <button type="button" data-idx="${i}" class="live-tab-btn ${i === activeEventIdx ? 'active' : ''}">
        ${ev.name || "Event"}
      </button>`).join("");

    tabsEl.querySelectorAll(".live-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeEventIdx = parseInt(btn.dataset.idx, 10);
        renderTabs(events);
        renderEvent(events);
      });
    });
  }

  function showNotLive() {
    tabsEl.innerHTML = "";
    roundTabsEl.innerHTML = "";
    roundTabsEl.style.display = "none";
    liveWrap.innerHTML = `<p class="empty-state">Results aren't live yet. Check back soon!</p>`;
    liveBadgeEl.classList.remove("show");
    lastUpdatedEl.textContent = "";
  }

  onSnapshot(doc(liveDb, "site", "liveResults"), (snap) => {
    // Rankings/medals only ever render when the organizer has flipped "Mark as LIVE" on.
    if (!snap.exists() || !snap.data().isLive || !snap.data().events || snap.data().events.length === 0) {
      showNotLive();
      return;
    }
    const d = snap.data();
    liveBadgeEl.classList.add("show");
    renderTabs(d.events);
    renderEvent(d.events);
    lastUpdatedEl.textContent = "Updated: " + new Date().toLocaleTimeString();
  });
</script>

</body>
</html>
