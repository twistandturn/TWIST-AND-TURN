<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Results — Twist & Turn</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="../index.html" title="Back to main site">←</a>
  <h1>Twist &amp; Turn — Live Results</h1>
  <a class="icon-btn" href="admin/" title="Organizer info">⚙️</a>
</div>

<div class="content" style="max-width:900px; margin:0 auto;">
  <p class="eyebrow" style="margin-top:1.5rem;">Competitions</p>
  <h2 class="font-display" style="font-size:1.6rem; font-weight:700; margin:.2rem 0 1.4rem;">Choose a competition</h2>

  <div id="list" style="display:flex; flex-direction:column; gap:.9rem;">
    <div class="empty-state"><span class="spinner"></span></div>
  </div>
</div>

<script type="module">
  import { loadSheet, pollEvery } from "./assets/sheets.js";

  const listEl = document.getElementById("list");

  pollEvery(20, async () => {
    try {
      const rows = await loadSheet("Competitions");
      if (!rows.length) {
        listEl.innerHTML = `<div class="empty-state">No competitions have been added yet.<br>Check back once the organizer sets one up.</div>`;
        return;
      }
      rows.sort((a, b) => (b.startDate || "").localeCompare(a.startDate || ""));
      listEl.innerHTML = "";
      rows.forEach(c => {
        if (!c.id) return;
        const a = document.createElement("a");
        a.href = `competition.html?id=${encodeURIComponent(c.id)}`;
        a.className = "comp-card";
        a.style.display = "block";
        a.innerHTML = `
          <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.1rem;">${c.name || "Untitled Competition"}</div>
          <div style="color:var(--ink-muted); font-size:.86rem; margin-top:.3rem;">
            ${c.venue ? c.venue + " · " : ""}${c.startDate || ""}${c.endDate && c.endDate !== c.startDate ? " – " + c.endDate : ""}
          </div>`;
        listEl.appendChild(a);
      });
    } catch (err) {
      listEl.innerHTML = `<div class="empty-state">Couldn't load competitions.<br><span class="mono" style="font-size:.75rem;">${err.message}</span></div>`;
    }
  });
</script>
</body>
</html>
