<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitor — Twist & Turn</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" id="backBtn" title="Back to competitors">←</a>
  <h1 id="pageTitle">Loading…</h1>
</div>

<div class="content" style="max-width:900px; margin:0 auto;">
  <div id="body"><div class="empty-state"><span class="spinner"></span></div></div>
</div>

<script type="module">
  import { loadSheet, pollEvery } from "./assets/sheets.js";
  import { EVENTS, FORMATS, qs, formatAttempt, parseAttemptInput, flagFor, computeResult } from "./assets/common.js";

  const compId = qs("id");
  const personId = qs("person");
  document.getElementById("backBtn").href = `competitors.html?id=${compId}`;

  pollEvery(15, async () => {
    let events, rounds, competitors, results;
    try {
      [events, rounds, competitors, results] = await Promise.all([
        loadSheet("Events"), loadSheet("Rounds"), loadSheet("Competitors"), loadSheet("Results")
      ]);
    } catch (err) {
      document.getElementById("body").innerHTML = `<div class="empty-state">${err.message}</div>`;
      return;
    }

    const person = competitors.find(p => p.compId === compId && p.competitorId === personId);
    if (!person) {
      document.getElementById("body").innerHTML = `<div class="empty-state">Competitor not found.</div>`;
      return;
    }
    document.getElementById("pageTitle").textContent = person.name;
    document.title = `${person.name} — Live Results`;

    document.getElementById("body").innerHTML = `
      <div style="display:flex; align-items:center; gap:.8rem; margin:1.2rem 0 1.6rem;">
        <span style="font-size:2rem;">${flagFor(person.country)}</span>
        <div>
          <div class="font-display" style="font-size:1.4rem; font-weight:700;">${person.name}</div>
          <div style="color:var(--ink-muted); font-size:.85rem;">${person.country || ""}</div>
        </div>
      </div>
      <div id="events"></div>
    `;

    const compEvents = events.filter(e => e.compId === compId).sort((a, b) => (+a.order || 0) - (+b.order || 0));
    const eventsWrap = document.getElementById("events");
    let anyResults = false;

    compEvents.forEach(ev => {
      const eventId = ev.eventId;
      const meta = EVENTS[eventId] || { name: eventId, kind: "time" };
      const evName = ev.name || meta.name;

      const evRounds = rounds.filter(r => r.compId === compId && r.eventId === eventId).sort((a, b) => (+a.order || 0) - (+b.order || 0));
      const roundRows = [];
      evRounds.forEach(round => {
        const resultRow = results.find(r => r.compId === compId && r.eventId === eventId && r.roundId === round.roundId && r.competitorId === personId);
        if (!resultRow) return;
        const attempts = ["a1", "a2", "a3", "a4", "a5"].map(k => parseAttemptInput(resultRow[k], meta.kind)).filter(v => v !== null);
        const { best, average } = computeResult(attempts, round.format, meta.kind);
        roundRows.push({ round, attempts, best, average });
      });
      if (!roundRows.length) return;
      anyResults = true;

      const fmtOf = (round) => FORMATS[round.format] || FORMATS.bo3;
      let rows = `<table class="results"><thead><tr>
        <th>Round</th><th>Attempts</th><th>Mean</th><th>Best</th>
      </tr></thead><tbody>`;
      roundRows.forEach(({ round, attempts, best, average }) => {
        const fmt = fmtOf(round);
        rows += `<tr>
          <td>${round.name || "Round"}</td>
          <td class="mono">${attempts.map(a => formatAttempt(a, meta.kind)).join(", ")}</td>
          <td class="mono">${fmt.hasAverage ? formatAttempt(average, meta.kind) : "—"}</td>
          <td class="mono" style="font-weight:700;">${formatAttempt(best, meta.kind)}</td>
        </tr>`;
      });
      rows += `</tbody></table>`;

      const section = document.createElement("div");
      section.className = "card";
      section.style.marginBottom = "1rem";
      section.style.padding = "1.1rem 1.3rem";
      section.innerHTML = `<div class="font-display" style="font-weight:700; margin-bottom:.5rem;">${evName}</div>${rows}`;
      eventsWrap.appendChild(section);
    });

    if (!anyResults) {
      eventsWrap.innerHTML = `<div class="empty-state">No results recorded for this competitor yet.</div>`;
    }
  });
</script>
</body>
</html>
