<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Twist & Turn</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <a class="back-btn" id="backBtn" title="Back to schedule">←</a>
  <h1 id="pageTitle">Loading…</h1>
</div>

<div class="content" style="max-width:900px; margin:0 auto;">
  <p class="eyebrow" id="eventLabel"></p>
  <h2 class="font-display" id="roundLabel" style="font-size:1.5rem; font-weight:700; margin:.2rem 0 1.3rem;"></h2>
  <div class="card" style="overflow-x:auto;">
    <div id="tableWrap" style="padding:1rem;"><div class="empty-state"><span class="spinner"></span></div></div>
  </div>
</div>

<script type="module">
  import { loadSheet, pollEvery } from "./assets/sheets.js";
  import { EVENTS, FORMATS, qs, formatAttempt, parseAttemptInput, flagFor, rankResults, computeResult } from "./assets/common.js";

  const compId = qs("id");
  const eventId = qs("event");
  const roundId = qs("round");

  document.getElementById("backBtn").href = `competition.html?id=${compId}&event=${eventId}`;

  const tableWrap = document.getElementById("tableWrap");
  let titled = false;

  pollEvery(10, async () => {
    let competitions, events, rounds, competitors, results;
    try {
      [competitions, events, rounds, competitors, results] = await Promise.all([
        loadSheet("Competitions"), loadSheet("Events"), loadSheet("Rounds"), loadSheet("Competitors"), loadSheet("Results")
      ]);
    } catch (err) {
      tableWrap.innerHTML = `<div class="empty-state">${err.message}</div>`;
      return;
    }

    const comp = competitions.find(c => c.id === compId);
    const ev = events.find(e => e.compId === compId && e.eventId === eventId);
    const round = rounds.find(r => r.compId === compId && r.eventId === eventId && r.roundId === roundId);
    if (!comp || !ev || !round) {
      tableWrap.innerHTML = `<div class="empty-state">Round not found. Check the Rounds tab has a matching compId/eventId/roundId row.</div>`;
      return;
    }
    const meta = EVENTS[eventId] || { name: eventId, kind: "time" };
    const fmt = FORMATS[round.format] || FORMATS.bo3;

    if (!titled) {
      document.title = `${ev.name || meta.name} ${round.name} — ${comp.name}`;
      document.getElementById("pageTitle").textContent = comp.name;
      document.getElementById("eventLabel").textContent = ev.name || meta.name;
      document.getElementById("roundLabel").textContent = round.name || "Round";
      titled = true;
    }

    const compPeople = {};
    competitors.filter(p => p.compId === compId).forEach(p => compPeople[p.competitorId] = p);

    const roundResults = results.filter(r => r.compId === compId && r.eventId === eventId && r.roundId === roundId);
    if (!roundResults.length) {
      tableWrap.innerHTML = `<div class="empty-state">No results entered yet. Check back soon!</div>`;
      return;
    }

    const rows = roundResults.map(r => {
      const attempts = ["a1", "a2", "a3", "a4", "a5"]
        .map(k => parseAttemptInput(r[k], meta.kind))
        .filter(v => v !== null);
      const { best, average } = computeResult(attempts, round.format, meta.kind);
      const person = compPeople[r.competitorId] || { name: r.competitorId, country: "" };
      return { id: r.competitorId, name: person.name, country: person.country, attempts, best, average };
    });

    renderTable(rankResults(rows), fmt, meta.kind);
  });

  function renderTable(rows, fmt, kind) {
    const attemptCols = Array.from({ length: fmt.attempts }, (_, i) => i + 1);
    let html = `<table class="results"><thead><tr>
      <th>#</th><th>Name</th><th>Country</th>
      ${attemptCols.map(n => `<th>${n}</th>`).join("")}
      ${fmt.hasAverage ? `<th>${fmt.avgLabel}</th>` : ""}
      <th>Best</th>
    </tr></thead><tbody>`;

    rows.forEach((r, i) => {
      const pos = i + 1;
      const podiumClass = pos <= 3 ? `podium-${pos}` : "";
      html += `<tr class="${podiumClass}">
        <td>${pos}</td>
        <td><a href="person.html?id=${compId}&person=${encodeURIComponent(r.id)}">${r.name}</a></td>
        <td>${flagFor(r.country)} ${r.country || ""}</td>
        ${attemptCols.map(n => `<td class="mono">${formatAttempt(r.attempts[n - 1], kind)}</td>`).join("")}
        ${fmt.hasAverage ? `<td class="mono" style="font-weight:700;">${formatAttempt(r.average, kind)}</td>` : ""}
        <td class="mono" style="font-weight:700;">${formatAttempt(r.best, kind)}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    tableWrap.innerHTML = html;
  }
</script>
</body>
</html>
