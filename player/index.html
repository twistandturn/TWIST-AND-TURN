<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twist & Turn | Player Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif;background:#101218;color:#F2F1ED}
.font-display{font-family:"Space Grotesk",sans-serif}
.card{background:#181B24;border:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>

<nav class="border-b border-white/10 p-4">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="font-display text-2xl font-bold">Twist & Turn</h1>
<a href="index.html" class="text-yellow-400">← Home</a>
</div>
</nav>

<main class="max-w-6xl mx-auto p-6">

<section class="card rounded-3xl p-8">
<div class="flex flex-col md:flex-row gap-8 items-center">

<img id="playerPhoto" src="default-avatar.png" class="w-40 h-40 rounded-full object-cover border-4 border-red-500">

<div class="flex-1">
<h1 id="playerName" class="font-display text-4xl font-bold">Loading...</h1>
<p id="playerId" class="text-yellow-400 mt-2">TT0000</p>
<p id="playerCity" class="text-gray-400">City</p>

<div class="mt-4">
<span id="verifiedBadge" class="bg-green-600 px-4 py-2 rounded-full">✔ Verified Player</span>
</div>
</div>

<div class="card rounded-2xl p-6 text-center min-w-[220px]">
<h3 class="font-display text-xl">Player Level</h3>
<p id="playerLevel" class="text-3xl mt-3 font-bold">Rookie</p>
<p class="text-gray-400">Level 1</p>
</div>

</div>
</section>

<section class="grid md:grid-cols-4 gap-5 mt-8">
<div class="card rounded-2xl p-6 text-center"><div class="text-3xl">🏆</div><h2 id="rank">#0</h2><p>Rank</p></div>
<div class="card rounded-2xl p-6 text-center"><div class="text-3xl">⏱</div><h2 id="pb">--</h2><p>PB</p></div>
<div class="card rounded-2xl p-6 text-center"><div class="text-3xl">⭐</div><h2 id="rating">1200</h2><p>Rating</p></div>
<div class="card rounded-2xl p-6 text-center"><div class="text-3xl">🎯</div><h2 id="competitions">0</h2><p>Competitions</p></div>
</section>

<section class="mt-10">
<h2 class="font-display text-3xl mb-4">Achievements</h2>
<div id="achievementContainer" class="grid md:grid-cols-3 gap-4">
<div class="card rounded-xl p-5 text-center">No achievements yet.</div>
</div>
</section>

<section class="mt-10">
<h2 class="font-display text-3xl mb-4">Competition History</h2>
<div id="historyContainer" class="card rounded-2xl p-5">
History will load from Firebase...
</div>
</section>

<section class="mt-10">
<h2 class="font-display text-3xl mb-4">Certificates</h2>
<div id="certificateContainer" class="card rounded-2xl p-5">
Certificates will appear here.
</div>
</section>

</main>

<script src="player.js" type="module"></script>

</body>
</html>
