<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previous Competitions | Twist & Turn</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8412B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#101218;
    --bg-surface:#181B24;
    --ink:#F2F1ED;
    --ink-muted:#9297A6;
    --cube-red:#E8412B;
    --cube-yellow:#F2B705;
    --cube-blue:#2F6FE0;
    --cube-green:#22A35C;
  }
  body{ font-family:'Inter', sans-serif; scroll-behavior:smooth; background:var(--bg-base); color:var(--ink); }
  .font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-muted); }
  .surface-card{ background:var(--bg-surface); border:1px solid rgba(255,255,255,0.06); }
  .accent-border-green{ border-left:3px solid var(--cube-green); }
  .interactive-card{ position:relative; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease; will-change:transform, box-shadow; }
  .interactive-card:hover, .interactive-card:focus-within{ transform:translateY(-6px); box-shadow:0 18px 35px rgba(0,0,0,0.35); }
  @media (prefers-reduced-motion: reduce){ .interactive-card:hover{ transform:none; } }
  .btn-primary{ background:var(--cube-red); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .status-pill{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; padding:4px 12px; border-radius:9999px; background:rgba(34,163,92,0.15); color:var(--cube-green); }
  ::selection{ background:var(--cube-yellow); color:#101218; }
  section[id]{ scroll-margin-top: 80px; }
  .comp-nav-btn{ font-family:'JetBrains Mono', monospace; font-size:0.8rem; padding:10px 18px; border-radius:9999px; border:1px solid rgba(255,255,255,0.1); color:var(--ink-muted); background:var(--bg-surface); transition:all .2s ease; white-space:nowrap; }
  .comp-nav-btn:hover{ border-color:var(--cube-blue); color:var(--ink); }
  .comp-nav-btn.active{ background:var(--cube-blue); border-color:var(--cube-blue); color:#fff; }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<nav class="sticky top-0 z-50 border-b border-white/5" style="background:rgba(16,18,24,0.85); backdrop-filter:blur(10px);">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center relative">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
        <img src="logo.png.jpeg" alt="Logo" class="h-9 w-auto rounded-full p-0.5 bg-white/90" onerror="this.onerror=null;this.src='https://placehold.co/40x40/101218/F2B705?text=T%26T';">
        <span class="font-display font-bold text-xl tracking-tight">Twist &amp; Turn</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="menuBtn" class="md:hidden text-3xl leading-none text-[var(--ink)]">☰</button>
      </div>
      <div id="navLinks" class="hidden absolute top-full right-0 mt-2 w-full md:static md:mt-0 md:w-auto md:flex md:items-center md:space-x-1 text-right md:text-left font-mono text-sm uppercase tracking-wider" style="background:var(--bg-surface);">
        <button onclick="window.location.href='index.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Home</button>
        <button onclick="window.location.href='competition/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Upcoming</button>
        <button onclick="window.location.href='timer.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-red)] transition border-b-2 border-transparent hover:border-[var(--cube-red)] md:inline-block md:w-auto md:p-2">⏱️ Timer</button>
        <button onclick="window.location.href='avgcalculator/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-blue)] transition border-b-2 border-transparent hover:border-[var(--cube-blue)] md:inline-block md:w-auto md:p-2">🧮 Avg Calc</button>
        <button onclick="window.location.href='records.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">🏆 Records</button>
        <button onclick="window.location.href='previous-competitions.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-blue)] transition border-b-2 border-[var(--cube-blue)] md:inline-block md:w-auto md:p-2">Previous</button>
        <button onclick="window.location.href='live/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-red)] transition border-b-2 border-transparent hover:border-[var(--cube-red)] md:inline-block md:w-auto md:p-2">Live</button>
        <button onclick="window.location.href='index.html#organizer'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-blue)] transition border-b-2 border-transparent hover:border-[var(--cube-blue)] md:inline-block md:w-auto md:p-2">Organizer</button>
        <button onclick="window.location.href='index.html#contact'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Contact</button>
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow">

  <section class="py-16 md:py-20" style="background:radial-gradient(1200px 400px at 80% -10%, rgba(47,111,224,0.14), transparent 60%), var(--bg-base);">
    <div class="max-w-4xl mx-auto px-4 text-center">
      <p class="eyebrow mb-2">Archive</p>
      <h1 class="font-display text-4xl md:text-5xl font-bold tracking-tight mb-4">Previous Competitions</h1>
      <p class="text-lg" style="color:var(--ink-muted);">Explore the results, records, and highlights from past Twist &amp; Turn events.</p>
    </div>
  </section>

  <section class="py-16">
    <div class="max-w-5xl mx-auto px-4">

      <!-- Competition switcher: pick a past competition to view its poster + results -->
      <div id="comp-nav" class="flex flex-wrap gap-2 mb-12"></div>

      <div id="comp-detail"></div>

      <p id="comp-empty" class="hidden text-center py-16" style="color:var(--ink-muted);">Abhi koi previous competition add nahi hui hai.</p>

    </div>
  </section>

</main>

<footer class="py-8 text-center font-mono text-xs" style="color:var(--ink-muted); border-top:1px solid rgba(255,255,255,0.06);">
  © 2026 Twist &amp; Turn — Speedcubing Arena
</footer>

<script>
  const menuBtn = document.getElementById("menuBtn");
  const navLinks = document.getElementById("navLinks");
  if (menuBtn && navLinks) {
    menuBtn.addEventListener("click", () => {
      navLinks.classList.toggle("hidden");
      menuBtn.innerHTML = navLinks.classList.contains("hidden") ? "☰" : "✖";
    });
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Shown immediately (no network wait) so the page is never empty while
  // Firestore loads / if it's offline. Anything saved via manage.html merges in on top.
  const DEFAULT_COMPS = [
    {
      id: "s1-default",
      order: 1,
      title: "Twist & Turn S1",
      date: "4–5 July 2026",
      mode: "Online Competition",
      poster: "logo.png.jpeg",
      results: [
        { event: "3x3", first: "MOHITH B", second: "LIM KAI YI", third: "CHIRAG GUPTA" },
        { event: "2x2", first: "MOHITH B", second: "RUTHVIK SHELKE", third: "LIM KAI YI" },
        { event: "3x3 One-Handed", first: "MOHITH B", second: "LIM KAI YI", third: "SYED WAFA ANDRABI" },
        { event: "Clock", first: "JUNAID EKHLAQUE", second: "AARIZ ALI", third: "MOHITH B" },
        { event: "Skewb", first: "LIM KAI YI", second: "MOHITH B", third: "JUNAID EKHLAQUE" },
        { event: "Pyraminx", first: "MOHITH B", second: "LIM KAI YI", third: "SYED WAFA ANDRABI" }
      ],
      ageCategories: []
    }
  ];

  const compNav = document.getElementById("comp-nav");
  const compDetail = document.getElementById("comp-detail");
  const compEmpty = document.getElementById("comp-empty");

  let comps = {};
  let activeId = null;

  function escapeHtml(str) {
    return (str || "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function resultsTable(rows) {
    if (!rows || rows.length === 0) return "";
    return `
      <div class="overflow-x-auto rounded-2xl shadow-xl surface-card">
        <table class="w-full border-collapse font-mono text-sm">
          <thead style="background:var(--cube-green); color:#0B1A10;">
            <tr>
              <th class="px-6 py-4 text-left font-bold">Event</th>
              <th class="px-6 py-4 text-left font-bold">1st 🥇</th>
              <th class="px-6 py-4 text-left font-bold">2nd 🥈</th>
              <th class="px-6 py-4 text-left font-bold">3rd 🥉</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5">
            ${rows.map(r => `
              <tr class="hover:bg-white/5 transition-colors">
                <td class="px-6 py-4 font-semibold">${escapeHtml(r.event)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.first)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.second)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.third)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function ageCategoryTable(rows) {
    if (!rows || rows.length === 0) return "";
    return `
      <div class="overflow-x-auto rounded-2xl shadow-xl surface-card">
        <table class="w-full border-collapse font-mono text-sm">
          <thead style="background:var(--cube-yellow); color:#101218;">
            <tr>
              <th class="px-6 py-4 text-left font-bold">Age Category</th>
              <th class="px-6 py-4 text-left font-bold">1st 🥇</th>
              <th class="px-6 py-4 text-left font-bold">2nd 🥈</th>
              <th class="px-6 py-4 text-left font-bold">3rd 🥉</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5">
            ${rows.map(r => `
              <tr class="hover:bg-white/5 transition-colors">
                <td class="px-6 py-4 font-semibold">${escapeHtml(r.category)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.first)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.second)}</td>
                <td class="px-6 py-4" style="color:#D6D8DF;">${escapeHtml(r.third)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderNav() {
    const ids = Object.keys(comps).sort((a, b) => (comps[b].order || 0) - (comps[a].order || 0));
    if (ids.length === 0) {
      compNav.innerHTML = "";
      compDetail.innerHTML = "";
      compEmpty.classList.remove("hidden");
      return;
    }
    compEmpty.classList.add("hidden");
    if (!activeId || !comps[activeId]) activeId = ids[0];

    compNav.innerHTML = ids.map(id => `
      <button type="button" class="comp-nav-btn ${id === activeId ? "active" : ""}" data-id="${id}">${escapeHtml(comps[id].title)}</button>
    `).join("");

    compNav.querySelectorAll(".comp-nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeId = btn.dataset.id;
        renderNav();
        renderDetail();
      });
    });
  }

  function renderDetail() {
    if (!activeId || !comps[activeId]) { compDetail.innerHTML = ""; return; }
    const c = comps[activeId];

    compDetail.innerHTML = `
      <div class="interactive-card surface-card accent-border-green rounded-2xl shadow-xl overflow-hidden">
        ${c.poster ? `<img src="${c.poster}" alt="${escapeHtml(c.title)}" class="w-full h-auto" onerror="this.style.display='none';">` : ""}
        <div class="p-8">
          <span class="status-pill">✅ Completed</span>
          <h2 class="font-display text-3xl font-bold mt-4 mb-2">${escapeHtml(c.title)}</h2>
          <p style="color:var(--ink-muted);" class="mb-2 leading-relaxed">
            ${c.date ? `📅 ${escapeHtml(c.date)}<br>` : ""}
            ${c.mode ? `🌐 ${escapeHtml(c.mode)}` : ""}
          </p>
        </div>
      </div>

      <section class="mt-16">
        <p class="eyebrow mb-2">Leaderboard</p>
        <h2 class="font-display text-3xl font-bold mb-8">${escapeHtml(c.title)} Results</h2>
        ${resultsTable(c.results)}
      </section>

      ${c.ageCategories && c.ageCategories.length ? `
        <section class="mt-16">
          <p class="eyebrow mb-2">Age Category</p>
          <h2 class="font-display text-3xl font-bold mb-8">Age Category Winners</h2>
          ${ageCategoryTable(c.ageCategories)}
        </section>
      ` : ""}
    `;
  }

  // Seed defaults immediately, then merge in whatever's saved in Firestore.
  DEFAULT_COMPS.forEach(c => { comps[c.id] = c; });
  renderNav();
  renderDetail();

  async function loadPrevComps() {
    try {
      const snap = await getDocs(collection(db, "previousCompetitions"));
      if (snap.empty) return;
      snap.forEach(d => {
        comps[d.id] = { id: d.id, ...d.data() };
      });
      renderNav();
      renderDetail();
    } catch (err) {
      console.error("Could not load previous competitions from Firestore — showing defaults only.", err);
    }
  }
  loadPrevComps();
</script>

</body>
</html>
