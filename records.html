<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T&T Records — Twist & Turn</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E8412B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#101218;
    --bg-surface:#181B24;
    --ink:#F2F1ED;
    --ink-muted:#9297A6;
    --cube-red:#E8412B;
    --cube-yellow:#F2B705;
    --cube-blue:#2F6FE0;
    --cube-green:#22A35C;
  }
  body{ font-family:'Inter', sans-serif; scroll-behavior:smooth; background:var(--bg-base); color:var(--ink); }
  .font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:0.75rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-muted); }
  .surface-card{ background:var(--bg-surface); border:1px solid rgba(255,255,255,0.06); }
  .accent-border-red{ border-left:3px solid var(--cube-red); }
  .accent-border-yellow{ border-left:3px solid var(--cube-yellow); }
  .accent-border-blue{ border-left:3px solid var(--cube-blue); }
  .accent-border-green{ border-left:3px solid var(--cube-green); }
  .interactive-card{ position:relative; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease; will-change:transform, box-shadow; }
  .interactive-card:hover, .interactive-card:focus-within{ transform:translateY(-6px); box-shadow:0 18px 35px rgba(0,0,0,0.35); }
  @media (prefers-reduced-motion: reduce){ .interactive-card:hover{ transform:none; } }
  .btn-primary{ background:var(--cube-red); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; }
  .btn-primary:hover{ filter:brightness(1.08); }
  ::selection{ background:var(--cube-yellow); color:#101218; }
  section[id]{ scroll-margin-top: 80px; }

  /* Event tabs */
  .event-tab{ font-family:'JetBrains Mono', monospace; font-size:0.85rem; padding:10px 18px; border-radius:999px; border:1px solid rgba(255,255,255,0.1); color:var(--ink-muted); background:var(--bg-surface); transition:.25s; cursor:pointer; white-space:nowrap; }
  .event-tab:hover{ color:var(--ink); border-color:var(--cube-blue); }
  .event-tab.active{ background:var(--cube-red); color:#fff; border-color:var(--cube-red); }

  /* Category pill toggle */
  .cat-tab{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:0.9rem; padding:8px 22px; border-radius:999px; border:1px solid rgba(255,255,255,0.12); color:var(--ink-muted); background:transparent; cursor:pointer; transition:.25s; }
  .cat-tab.active{ background:var(--cube-blue); color:#fff; border-color:var(--cube-blue); }

  /* Record hero card */
  .record-time{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:3rem; line-height:1; color:var(--cube-yellow); }
  @media (max-width:640px){ .record-time{ font-size:2.2rem; } }
  .record-crown{ font-size:2rem; }

  /* Ranking rows */
  .rank-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid rgba(255,255,255,0.05); transition:.2s; }
  .rank-row:last-child{ border-bottom:none; }
  .rank-row:hover{ background:rgba(255,255,255,0.03); }
  .rank-row.top3{ background:rgba(242,183,5,0.05); }
  .rank-num{ font-family:'JetBrains Mono', monospace; width:2.2rem; text-align:center; color:var(--ink-muted); }
  .rank-time{ font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--cube-yellow); }

  .history-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px dashed rgba(255,255,255,0.06); font-size:0.92rem; }
  .history-row:last-child{ border-bottom:none; }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col">

<nav class="sticky top-0 z-50 border-b border-white/5" style="background:rgba(16,18,24,0.85); backdrop-filter:blur(10px);">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center relative">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
        <img src="logo.png.jpeg" alt="Logo" class="h-9 w-auto rounded-full p-0.5 bg-white/90" onerror="this.onerror=null;this.src='https://placehold.co/40x40/101218/F2B705?text=T%26T';">
        <span class="font-display font-bold text-xl tracking-tight">Twist &amp; Turn</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="menuBtn" class="md:hidden text-3xl leading-none text-[var(--ink)]">☰</button>
      </div>
      <div id="navLinks" class="hidden absolute top-full right-0 mt-2 w-full md:static md:mt-0 md:w-auto md:flex md:items-center md:space-x-1 text-right md:text-left font-mono text-sm uppercase tracking-wider" style="background:var(--bg-surface);">
        <button onclick="window.location.href='index.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Home</button>
        <button onclick="window.location.href='cuberush2026/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Upcoming</button>
        <button onclick="window.location.href='timer.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-red)] transition border-b-2 border-transparent hover:border-[var(--cube-red)] md:inline-block md:w-auto md:p-2">⏱️ Timer</button>
        <button onclick="window.location.href='records.html'" class="block w-full px-4 py-3 text-left md:inline-block md:w-auto md:p-2 border-b-2" style="color:var(--cube-yellow); border-color:var(--cube-yellow);">🏆 Records</button>
        <button onclick="window.location.href='/learnalgs/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-green)] transition border-b-2 border-transparent hover:border-[var(--cube-green)] md:inline-block md:w-auto md:p-2">📖 Learn Algs</button>
        <button onclick="window.location.href='previous-competitions.html'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-blue)] transition border-b-2 border-transparent hover:border-[var(--cube-blue)] md:inline-block md:w-auto md:p-2">Previous</button>
        <button onclick="window.location.href='live/'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-red)] transition border-b-2 border-transparent hover:border-[var(--cube-red)] md:inline-block md:w-auto md:p-2">Live</button>
        <button onclick="window.location.href='index.html#faq'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-green)] transition border-b-2 border-transparent hover:border-[var(--cube-green)] md:inline-block md:w-auto md:p-2">FAQ</button>
        <button onclick="window.location.href='index.html#contact'" class="block w-full px-4 py-3 text-left hover:text-[var(--cube-yellow)] transition border-b-2 border-transparent hover:border-[var(--cube-yellow)] md:inline-block md:w-auto md:p-2">Contact</button>
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow">

  <section id="records-hero" class="py-16 md:py-20 text-center" style="background:radial-gradient(1000px 400px at 50% -10%, rgba(242,183,5,0.10), transparent 60%);">
    <div class="max-w-4xl mx-auto px-4">
      <p class="eyebrow mb-3">Twist &amp; Turn Platform Records</p>
      <h1 class="font-display text-4xl md:text-6xl font-bold tracking-tight mb-3">🏆 T&amp;T Records</h1>
      <p class="text-lg md:text-xl" style="color:var(--ink-muted)">Official Single &amp; Average of 5 records set on the Twist &amp; Turn platform — updated live.</p>
    </div>
  </section>

  <section id="event-nav" class="pb-4">
    <div class="max-w-6xl mx-auto px-4">
      <div id="event-tabs" class="flex gap-3 flex-wrap justify-center">
        <p class="font-mono text-sm" style="color:var(--ink-muted)">Loading events…</p>
      </div>
    </div>
  </section>

  <section id="records-body" class="py-10">
    <div class="max-w-6xl mx-auto px-4">

      <div class="flex items-center justify-center gap-3 mb-10">
        <button type="button" class="cat-tab active" data-cat="single">Single</button>
        <button type="button" class="cat-tab" data-cat="ao5">Average of 5</button>
      </div>

      <!-- Current Record + History -->
      <div class="mb-14">
        <p class="eyebrow mb-2 text-center" id="records-event-label">—</p>
        <h2 class="font-display text-2xl md:text-3xl font-bold mb-8 text-center">Current Record</h2>

        <div id="current-record-card" class="interactive-card surface-card accent-border-yellow rounded-2xl p-8 md:p-10 shadow-xl max-w-xl mx-auto text-center">
          <p style="color:var(--ink-muted)">Loading…</p>
        </div>

        <div class="max-w-xl mx-auto mt-8">
          <button id="toggle-history-btn" type="button" class="w-full py-3 rounded-lg border border-white/10 font-mono text-sm" style="color:var(--ink-muted);">▾ Show Record History</button>
          <div id="record-history-wrap" class="hidden mt-4 surface-card rounded-2xl p-6 shadow-md">
            <div id="record-history-list"></div>
          </div>
        </div>
      </div>

      <!-- Rankings -->
      <div>
        <p class="eyebrow mb-2 text-center">Top 10</p>
        <h2 id="rankings-title" class="font-display text-2xl md:text-3xl font-bold mb-8 text-center">T&amp;T Rankings</h2>
        <div id="rankings-wrap" class="surface-card rounded-2xl shadow-xl overflow-hidden max-w-2xl mx-auto">
          <p class="p-8 text-center" style="color:var(--ink-muted)">Loading…</p>
        </div>
      </div>

    </div>
  </section>

</main>

<footer class="py-8 text-center font-mono text-xs" style="color:var(--ink-muted); border-top:1px solid rgba(255,255,255,0.06);">
  © 2026 Twist &amp; Turn — Speedcubing Arena
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig, "recordsApp");
  const db = getFirestore(app);

  // Fallback event list shown until Firestore responds (or if the
  // "ttRecords" collection is still empty) so the page never looks broken.
  // Admins can add more events any time from Manage → Records Management;
  // whatever exists in Firestore always wins over this list.
  const DEFAULT_EVENTS = [
    { id: "3x3",    label: "3×3",     order: 1 },
    { id: "2x2",    label: "2×2",     order: 2 },
    { id: "pyraminx",label: "Pyraminx",order: 3 },
    { id: "clock",  label: "Clock",   order: 4 },
    { id: "fto",    label: "FTO",     order: 5 },
    { id: "skewb",  label: "Skewb",   order: 6 },
    { id: "3x3oh",  label: "3×3 OH",  order: 7 }
  ];

  let eventsMeta = {};      // id -> { label, order }
  let eventDataCache = {};  // id -> firestore doc data (single/ao5 arrays)
  let unsubscribers = {};   // id -> onSnapshot unsubscribe fn
  let activeEvent = null;
  let activeCategory = "single";

  const eventTabsEl = document.getElementById("event-tabs");
  const catTabs = document.querySelectorAll(".cat-tab");
  const eventLabelEl = document.getElementById("records-event-label");
  const currentRecordCard = document.getElementById("current-record-card");
  const historyWrap = document.getElementById("record-history-wrap");
  const historyList = document.getElementById("record-history-list");
  const historyToggleBtn = document.getElementById("toggle-history-btn");
  const rankingsTitle = document.getElementById("rankings-title");
  const rankingsWrap = document.getElementById("rankings-wrap");

  function renderEventTabs() {
    const ids = Object.keys(eventsMeta).sort((a, b) => (eventsMeta[a].order ?? 99) - (eventsMeta[b].order ?? 99));
    eventTabsEl.innerHTML = ids.map(id => `
      <button type="button" class="event-tab ${id === activeEvent ? 'active' : ''}" data-event="${id}">${eventsMeta[id].label}</button>
    `).join("");
    eventTabsEl.querySelectorAll(".event-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeEvent = btn.dataset.event;
        renderEventTabs();
        renderAll();
      });
    });
  }

  function watchEvent(id) {
    if (unsubscribers[id]) return; // already watching
    unsubscribers[id] = onSnapshot(doc(db, "ttRecords", id), (snap) => {
      eventDataCache[id] = snap.exists() ? snap.data() : { single: [], ao5: [] };
      if (id === activeEvent) renderAll();
    });
  }

  function parseTimeToMs(str) {
    if (!str) return Infinity;
    const s = String(str).trim().toUpperCase();
    if (s === "DNF" || s === "DNS") return Infinity;
    const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
    if (!m) return Infinity;
    const mins = m[1] ? parseInt(m[1], 10) : 0;
    const secs = parseFloat(m[2]);
    return Math.round((mins * 60 + secs) * 1000);
  }

  function sortedResults(id, category) {
    const data = eventDataCache[id] || {};
    const list = Array.isArray(data[category]) ? data[category].slice() : [];
    return list
      .map(r => ({ ...r, timeMs: (typeof r.timeMs === "number" ? r.timeMs : parseTimeToMs(r.time)) }))
      .sort((a, b) => a.timeMs - b.timeMs);
  }

  function renderAll() {
    if (!activeEvent) return;
    eventLabelEl.textContent = (eventsMeta[activeEvent] && eventsMeta[activeEvent].label) || activeEvent;

    const catLabel = activeCategory === "ao5" ? "Average of 5" : "Single";
    rankingsTitle.textContent = `T&T ${eventLabelEl.textContent} — ${catLabel}`;

    const results = sortedResults(activeEvent, activeCategory);

    // ---- Current Record + History ----
    if (results.length === 0) {
      currentRecordCard.innerHTML = `<p style="color:var(--ink-muted)">No record set yet for this event/category.</p>`;
      historyList.innerHTML = `<p class="text-sm" style="color:var(--ink-muted)">No history yet.</p>`;
    } else {
      const rec = results[0];
      currentRecordCard.innerHTML = `
        <div class="record-crown mb-2">🥇</div>
        <div class="record-time mb-3">${rec.time || ""}</div>
        <p class="font-display text-xl font-bold">${rec.name || ""}</p>
        <p class="mt-2 text-sm" style="color:var(--ink-muted)">${rec.competition || ""}${rec.competition && rec.date ? " · " : ""}${rec.date || ""}</p>
      `;

      const prev = results.slice(1);
      if (prev.length === 0) {
        historyList.innerHTML = `<p class="text-sm" style="color:var(--ink-muted)">No previous records yet — this is the first one!</p>`;
      } else {
        historyList.innerHTML = prev.map(r => `
          <div class="history-row">
            <div>
              <span class="font-mono font-semibold" style="color:var(--ink)">${r.time || ""}</span>
              <span style="color:var(--ink-muted)"> — ${r.name || ""}</span>
            </div>
            <div class="text-xs text-right" style="color:var(--ink-muted)">
              ${r.competition || ""}${r.competition && r.date ? " · " : ""}${r.date || ""}
            </div>
          </div>
        `).join("");
      }
    }

    // ---- Rankings (Top 10) ----
    if (results.length === 0) {
      rankingsWrap.innerHTML = `<p class="p-8 text-center" style="color:var(--ink-muted)">No rankings yet for this event/category.</p>`;
    } else {
      const top10 = results.slice(0, 10);
      const medals = ["🥇", "🥈", "🥉"];
      rankingsWrap.innerHTML = top10.map((r, i) => `
        <div class="rank-row ${i < 3 ? 'top3' : ''}">
          <div class="flex items-center gap-4">
            <span class="rank-num">${medals[i] || (i + 1)}</span>
            <span class="font-semibold">${r.name || ""}</span>
          </div>
          <span class="rank-time">${r.time || ""}</span>
        </div>
      `).join("");
    }
  }

  // Category toggle
  catTabs.forEach(btn => {
    btn.addEventListener("click", () => {
      catTabs.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      renderAll();
    });
  });

  // History collapse toggle
  historyToggleBtn.addEventListener("click", () => {
    const isHidden = historyWrap.classList.contains("hidden");
    historyWrap.classList.toggle("hidden");
    historyToggleBtn.textContent = isHidden ? "▴ Hide Record History" : "▾ Show Record History";
  });

  // Load event list from Firestore ("ttRecords" collection), falling back
  // to the default list so the page still works before any admin data exists.
  getDocs(collection(db, "ttRecords")).then(snap => {
    if (!snap.empty) {
      snap.forEach(d => {
        const data = d.data();
        eventsMeta[d.id] = { label: data.label || d.id, order: typeof data.order === "number" ? data.order : 99 };
        eventDataCache[d.id] = data;
      });
    } else {
      DEFAULT_EVENTS.forEach(ev => {
        eventsMeta[ev.id] = { label: ev.label, order: ev.order };
        eventDataCache[ev.id] = { single: [], ao5: [] };
      });
    }
    const ids = Object.keys(eventsMeta).sort((a, b) => eventsMeta[a].order - eventsMeta[b].order);
    activeEvent = ids[0] || null;
    renderEventTabs();
    renderAll();
    ids.forEach(watchEvent); // live updates for every event tab
  }).catch(() => {
    DEFAULT_EVENTS.forEach(ev => {
      eventsMeta[ev.id] = { label: ev.label, order: ev.order };
      eventDataCache[ev.id] = { single: [], ao5: [] };
    });
    activeEvent = DEFAULT_EVENTS[0].id;
    renderEventTabs();
    renderAll();
  });
</script>

<script src="script.js"></script>
</body>
</html>
