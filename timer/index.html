<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twist & Turn - csTimer Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base: #1f1f24; /* csTimer dark vibe */
    --bg-panel: #282830;
    --ink: #f0f0f0; 
    --ink-muted: #9a9a9a;
    --cube-red: #ff5252; --cube-yellow: #ffd740; --cube-blue: #448aff; --cube-green: #69f0ae;
  }
  *{ box-sizing: border-box; }
  body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg-base); 
    color: var(--ink); 
    overscroll-behavior: none; 
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .font-mono{ font-family: 'JetBrains Mono', monospace; }
  
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-base); }
  ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
  
  /* Inputs & Buttons */
  select, input { background: #383842; border: 1px solid #444; color: var(--ink); outline: none; border-radius: 4px; }
  select:focus, input:focus { border-color: var(--cube-blue); }
  button { cursor: pointer; border: none; background: transparent; color: var(--ink); transition: 0.15s; }
  .btn-solid { background: #383842; border: 1px solid #444; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; }
  .btn-solid:hover { background: #484852; }
  
  /* Layout Areas */
  #top-bar { background: var(--bg-panel); border-bottom: 1px solid #111; }
  #main-area { display: flex; flex: 1; overflow: hidden; }
  #left-sidebar { width: 280px; background: var(--bg-panel); border-right: 1px solid #111; display: flex; flex-direction: column; }
  #timer-container { flex: 1; display: flex; flex-direction: column; position: relative; }
  
  /* Timer Area */
  #timer-zone {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer;
  }
  #timer-display {
    font-family: 'JetBrains Mono', monospace; font-weight: 700;
    font-size: clamp(4rem, 15vw, 12rem); line-height: 1; letter-spacing: -0.02em;
    transition: color .1s ease;
  }
  .state-holding #timer-display { color: var(--cube-red); }
  .state-ready #timer-display { color: var(--cube-green); }
  .state-running #timer-display { color: var(--ink); }

  /* Solve List Hover */
  .solve-row .solve-actions { opacity: 0; }
  .solve-row:hover .solve-actions { opacity: 1; }
  @media (hover:none){ .solve-row .solve-actions { opacity: 1; } }

  /* Light theme */
  html[data-theme="light"]{ 
    --bg-base: #f5f5f5; --bg-panel: #ffffff; --ink: #222; --ink-muted: #666;
    --cube-red: #d32f2f; --cube-green: #2e7d32;
  }
  html[data-theme="light"] #top-bar, html[data-theme="light"] #left-sidebar { border-color: #ddd; }
  html[data-theme="light"] .btn-solid, html[data-theme="light"] select, html[data-theme="light"] input { background: #eee; border-color: #ccc; color: #222;}
  html[data-theme="light"] .btn-solid:hover { background: #ddd; }
  html[data-theme="light"] .solve-row:hover { background: #f9f9f9; }

  /* Fullscreen mode (Distraction Free) */
  body.fs-active #top-bar, body.fs-active #left-sidebar { display: none !important; }
  body.fs-active #timer-container { border: none; }
  body.fs-active #scramble-bar { font-size: 1.5rem; padding: 20px; }
  
  .toggle-switch-input{ appearance:none; width:36px; height:20px; background:#444; border-radius:99px; position:relative; cursor:pointer; }
  .toggle-switch-input::before{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition:transform .15s ease; }
  .toggle-switch-input:checked{ background:var(--cube-blue); }
  .toggle-switch-input:checked::before{ transform:translateX(16px); }
</style>
</head>
<body>

  <nav id="top-bar" class="flex items-center justify-between px-4 py-2 shrink-0">
    <div class="flex items-center gap-4">
      <span class="font-bold text-lg tracking-tight">Twist & Turn</span>
      <select id="event-selector" class="px-2 py-1 text-sm font-semibold"></select>
    </div>
    <div class="flex items-center gap-2">
      <button id="settings-btn" class="btn-solid text-xs">⚙️ Settings</button>
      <button id="fullscreen-btn" class="btn-solid text-xs" title="Fullscreen">⛶ Fullscreen</button>
    </div>
  </nav>

  <div id="main-area">
    <aside id="left-sidebar" class="shrink-0 z-10 shadow-lg">
      <div class="p-3 border-b border-black/20" style="border-bottom-color: rgba(150,150,150,0.2);">
        <div class="flex justify-between items-center mb-2">
          <span class="font-bold text-sm">Session Stats</span>
          <button id="clear-session-btn" class="text-xs px-2 py-1 rounded bg-red-900/30 text-red-400 hover:bg-red-900/50">Clear</button>
        </div>
        <div class="grid grid-cols-2 gap-x-2 gap-y-1 text-xs font-mono" style="color:var(--ink-muted);">
          <div>Solves: <span id="stat-count" class="text-[var(--ink)] font-bold">0</span></div>
          <div>Best: <span id="stat-best" class="text-[var(--cube-green)] font-bold">—</span></div>
          <div>Mean: <span id="stat-mean" class="text-[var(--ink)] font-bold">—</span></div>
          <div id="stat-avgs-grid" class="contents"></div>
        </div>
      </div>
      
      <div class="p-2 text-xs font-bold text-center border-b border-black/20" style="color:var(--ink-muted); border-bottom-color: rgba(150,150,150,0.2);">Time List</div>
      <div id="solve-list" class="flex-1 overflow-y-auto font-mono text-sm">
        <p class="p-4 text-center text-xs" style="color:var(--ink-muted);">No solves yet.</p>
      </div>
    </aside>

    <main id="timer-container">
      
      <div id="scramble-bar" class="w-full p-3 md:p-4 text-center shrink-0 flex flex-col items-center justify-center min-h-[5rem]" style="background: rgba(0,0,0,0.1);">
        <p id="scramble-text" class="font-mono text-lg md:text-xl font-bold leading-snug w-full max-w-4xl" style="color:var(--cube-green);"></p>
        <div class="mt-2 flex gap-2">
           <button id="new-scramble-btn" class="btn-solid text-[10px] uppercase tracking-wider">New Scramble</button>
        </div>
      </div>

      <div id="timer-zone">
        <div id="timer-display">0.00</div>
        
        <input id="type-time-input" type="text" inputmode="numeric" autocomplete="off" placeholder="0.00"
          class="hidden w-full max-w-xs bg-transparent text-center font-mono font-bold outline-none border-b-2 border-transparent focus:border-blue-500"
          style="font-size:clamp(3rem, 10vw, 6rem); line-height:1; color:var(--ink);">
          
        <p id="timer-hint" class="text-xs mt-6 uppercase tracking-widest font-semibold" style="color:var(--ink-muted);">Hold SPACE to start</p>

        <div id="post-solve-panel" class="hidden items-center justify-center gap-2 mt-6">
          <button data-p="ok" class="post-penalty-btn btn-solid text-green-400 border-green-900/50">OK</button>
          <button data-p="+2" class="post-penalty-btn btn-solid text-yellow-400 border-yellow-900/50">+2</button>
          <button data-p="dnf" class="post-penalty-btn btn-solid text-red-400 border-red-900/50">DNF</button>
        </div>
      </div>
    </main>
  </div>

  <div id="settings-backdrop" class="hidden fixed inset-0 z-50" style="background:rgba(0,0,0,0.6);"></div>
  <aside id="settings-drawer" class="fixed top-0 right-0 h-full w-full max-w-sm z-50 p-5 overflow-y-auto transition-transform duration-200" style="background:var(--bg-panel); transform:translateX(100%);">
    <div class="flex items-center justify-between mb-6 border-b border-gray-600 pb-3">
      <h2 class="font-bold text-lg">⚙️ Settings</h2>
      <button id="settings-close-btn" class="btn-solid">✕ Close</button>
    </div>
    <div class="space-y-6">
      <div>
        <p class="text-xs uppercase tracking-widest mb-3 text-gray-400">Timer Settings</p>
        <label class="flex items-center justify-between py-1">
          <span class="text-sm">Manual Time Entry</span>
          <input type="checkbox" id="setting-manual" class="toggle-switch-input">
        </label>
        <label class="flex items-center justify-between py-1 mt-2">
          <span class="text-sm">15s WCA Inspection</span>
          <input type="checkbox" id="setting-inspection" class="toggle-switch-input">
        </label>
      </div>
      <div>
        <p class="text-xs uppercase tracking-widest mb-3 text-gray-400">Appearance</p>
        <div class="flex gap-2">
          <button type="button" data-theme-btn="dark" class="theme-btn flex-1 py-1 text-sm border border-gray-600 rounded">Dark</button>
          <button type="button" data-theme-btn="light" class="theme-btn flex-1 py-1 text-sm border border-gray-600 rounded">Light</button>
        </div>
      </div>
      <div>
        <p class="text-xs uppercase tracking-widest mb-3 text-gray-400">Extra Averages</p>
        <label class="flex items-center justify-between py-1"><span class="text-sm">Ao100</span><input type="checkbox" data-avg="100" class="toggle-switch-input avg-toggle"></label>
        <label class="flex items-center justify-between py-1"><span class="text-sm">Ao200</span><input type="checkbox" data-avg="200" class="toggle-switch-input avg-toggle"></label>
      </div>
    </div>
  </aside>

  <div id="share-backdrop" class="hidden fixed inset-0 z-[80] items-center justify-center p-4" style="background:rgba(0,0,0,0.6);">
    <div class="rounded-lg p-5 w-full max-w-sm shadow-2xl" style="background:var(--bg-panel); border:1px solid rgba(255,255,255,0.1);">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-lg">🎉 Share Result</h3>
        <button id="share-close-btn" class="btn-solid">✕</button>
      </div>
      <pre id="share-preview" class="font-mono text-xs whitespace-pre-wrap p-3 rounded mb-4" style="background:var(--bg-base); max-height:180px; overflow-y:auto; border:1px solid #444;"></pre>
      <div class="flex gap-2">
        <button id="share-copy-btn" class="flex-1 btn-solid py-2 text-center bg-blue-600 hover:bg-blue-500 border-none">📋 Copy</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { randomScrambleForEvent } from "https://cdn.cubing.net/v0/js/cubing/scramble";

    // ==========================================================
    // Events
    // ==========================================================
    const EVENTS = [
      { id: "333", label: "3x3x3" },
      { id: "222", label: "2x2x2" },
      { id: "444", label: "4x4x4" },
      { id: "555", label: "5x5x5" },
      { id: "666", label: "6x6x6" },
      { id: "777", label: "7x7x7" },
      { id: "333bf", label: "3x3 BLD" },
      { id: "333oh", label: "3x3 OH" },
      { id: "clock", label: "Clock" },
      { id: "minx", label: "Megaminx" },
      { id: "pyram", label: "Pyraminx" },
      { id: "skewb", label: "Skewb" },
      { id: "sq1", label: "Square-1" }
    ];

    let currentEvent = localStorage.getItem("tt-timer-event") || "333";
    if (!EVENTS.some(e => e.id === currentEvent)) currentEvent = "333";

    const eventSelect = document.getElementById("event-selector");
    
    function renderTabs() {
      eventSelect.innerHTML = EVENTS.map(ev => 
        `<option value="${ev.id}" ${ev.id === currentEvent ? "selected" : ""}>${ev.label}</option>`
      ).join("");
    }
    
    eventSelect.addEventListener("change", (e) => {
      if (state !== "idle") { e.target.value = currentEvent; return; }
      currentEvent = e.target.value;
      localStorage.setItem("tt-timer-event", currentEvent);
      renderSolves();
      renderStats();
      getNewScramble();
    });

    // ==========================================================
    // Scramble logic
    // ==========================================================
    const scrambleTextEl = document.getElementById("scramble-text");
    let scrambleLoading = false;

    // Fallbacks
    function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
    function cubeScramble(faces, length, wideMode, restrictAxis) {
        const AXIS = { U:0, D:0, L:1, R:1, F:2, B:2 };
        const moves = []; let lastAxis = -1, lastFace = null;
        for (let i=0; i<length; i++) {
            let f; do { f = faces[randInt(0, faces.length-1)]; } while (f === lastFace || (restrictAxis && AXIS[f] === lastAxis));
            let s = Math.random() < 0.33 ? "" : Math.random() < 0.66 ? "'" : "2";
            if(wideMode) s = "w" + s;
            moves.push(f + s);
            lastFace = f; lastAxis = AXIS[f];
        }
        return moves.join(" ");
    }
    const FALLBACKS = {
        "555": () => cubeScramble(["U","D","L","R","F","B"], 60, false, true),
        "666": () => cubeScramble(["U","D","L","R","F","B"], 80, true, true),
    };

    async function getNewScramble() {
      scrambleLoading = true;
      scrambleTextEl.textContent = "Generating...";
      try {
        const scr = await randomScrambleForEvent(currentEvent);
        scrambleTextEl.textContent = scr.toString();
      } catch (e) {
        scrambleTextEl.textContent = FALLBACKS[currentEvent] ? FALLBACKS[currentEvent]() : "Scramble Error - Retry";
      }
      scrambleLoading = false;
    }
    document.getElementById("new-scramble-btn").addEventListener("click", () => { if (!scrambleLoading) getNewScramble(); });

    // ==========================================================
    // Storage & Solves
    // ==========================================================
    function storageKey(ev) { return "tt-timer-solves-" + ev; }
    function loadSolves() { try { return JSON.parse(localStorage.getItem(storageKey(currentEvent)) || "[]"); } catch { return []; } }
    function saveSolves(solves) { localStorage.setItem(storageKey(currentEvent), JSON.stringify(solves)); }

    // ==========================================================
    // Timer Core
    // ==========================================================
    const zone = document.getElementById("timer-zone");
    const display = document.getElementById("timer-display");
    const hint = document.getElementById("timer-hint");

    let state = "idle"; 
    let holdTimeout, runInterval, inspectionInterval;
    let runStartAt = 0, holdStartAt = 0, inspectionStartAt = 0;
    let pendingPenalty = null;

    function fmt(ms) {
      if (ms == null) return "—";
      const totalCs = Math.round(ms / 10);
      const cs = String(totalCs % 100).padStart(2, "0");
      const sec = Math.floor(totalCs / 100) % 60;
      const min = Math.floor(totalCs / 6000);
      return min > 0 ? `${min}:${String(sec).padStart(2, "0")}.${cs}` : `${sec}.${cs}`;
    }

    function setZoneState(s) {
      zone.classList.remove("state-holding", "state-ready", "state-running");
      if (s) zone.classList.add("state-" + s);
    }

    function isTyping() { return document.activeElement?.tagName === "INPUT"; }

    function beginPress() {
      if (typeMode || isTyping()) return;
      hidePostSolvePanel();
      if (state === "running") { stopTimer(); return; }
      if (state !== "idle") return; 

      if (settings.inspection) {
        state = "inspecting";
        inspectionStartAt = performance.now();
        hint.textContent = "Inspecting... keep holding to start";
        inspectionInterval = setInterval(() => {
          const el = (performance.now() - inspectionStartAt) / 1000;
          display.textContent = el <= 15 ? Math.max(0, 15 - el).toFixed(0) : (el <= 17 ? "+2" : "DNF");
        }, 100);
      } else {
        state = "holding";
        setZoneState("holding");
      }

      holdTimeout = setTimeout(() => {
        if (state === "holding" || state === "inspecting") {
          state = "ready";
          setZoneState("ready");
          display.textContent = "0.00";
        }
      }, 300);
    }

    function endPress() {
      if (isTyping()) return;
      if (state === "ready") {
        pendingPenalty = null;
        if (settings.inspection && inspectionInterval) {
          const el = (performance.now() - inspectionStartAt) / 1000;
          if (el > 17) pendingPenalty = "DNF"; else if (el > 15) pendingPenalty = "+2";
        }
        clearInterval(inspectionInterval); inspectionInterval = null;
        clearTimeout(holdTimeout);
        startTimer();
      } else if (state === "holding" || state === "inspecting") {
        clearTimeout(holdTimeout); clearInterval(inspectionInterval);
        state = "idle"; setZoneState(null);
        display.textContent = "0.00";
        hint.textContent = "Hold SPACE to start";
      }
    }

    function startTimer() {
      state = "running"; setZoneState("running"); hint.textContent = "";
      runStartAt = performance.now();
      runInterval = setInterval(() => display.textContent = fmt(performance.now() - runStartAt), 30);
    }

    function stopTimer() {
      clearInterval(runInterval);
      const ms = performance.now() - runStartAt;
      display.textContent = fmt(ms);
      state = "idle"; setZoneState(null);
      hint.textContent = "Hold SPACE to start";

      addSolve({ ms: Math.round(ms), penalty: pendingPenalty, scramble: scrambleTextEl.textContent, at: new Date().toISOString() });
      pendingPenalty = null;
      showPostSolvePanel();
      getNewScramble();
    }

    // Post-solve
    const postSolvePanel = document.getElementById("post-solve-panel");
    function showPostSolvePanel() { postSolvePanel.classList.remove("hidden"); postSolvePanel.classList.add("flex"); }
    function hidePostSolvePanel() { postSolvePanel.classList.add("hidden"); postSolvePanel.classList.remove("flex"); }
    
    postSolvePanel.querySelectorAll(".post-penalty-btn").forEach(b => {
      b.addEventListener("click", () => {
        const solves = loadSolves();
        if(!solves.length) return;
        solves[0].penalty = b.dataset.p === "ok" ? null : b.dataset.p === "+2" ? "+2" : "DNF";
        saveSolves(solves); renderSolves(); renderStats(); hidePostSolvePanel();
      });
    });

    document.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && !isTyping()) { e.preventDefault(); beginPress(); }});
    document.addEventListener("keyup", e => { if (e.code === "Space" && !isTyping()) { e.preventDefault(); endPress(); }});
    zone.addEventListener("touchstart", e => { e.preventDefault(); beginPress(); }, {passive:false});
    zone.addEventListener("touchend", e => { e.preventDefault(); endPress(); }, {passive:false});
    zone.addEventListener("mousedown", beginPress);
    zone.addEventListener("mouseup", endPress);

    // ==========================================================
    // Type Mode
    // ==========================================================
    let typeMode = false;
    const typeInput = document.getElementById("type-time-input");

    function setTypeMode(on) {
      typeMode = on; hidePostSolvePanel();
      if (on) {
        display.classList.add("hidden"); typeInput.classList.remove("hidden");
        typeInput.value = ""; typeInput.focus();
        hint.textContent = "Type numbers (e.g. 1234 -> 12.34) and hit Enter";
      } else {
        display.classList.remove("hidden"); typeInput.classList.add("hidden");
        hint.textContent = "Hold SPACE to start";
      }
    }

    typeInput.addEventListener("input", () => {
      let v = typeInput.value.replace(/[^\d]/g, "");
      if(!v) return;
      v = v.slice(-7).padStart(3, "0");
      const cs = v.slice(-2), sec = v.slice(0,-2).padStart(2,"0").slice(-2), min = v.slice(0,-4);
      typeInput.value = (min.length && parseInt(min) > 0 ? `${parseInt(min)}:${sec}` : `${parseInt(sec)}`) + `.${cs}`;
    });

    typeInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && typeInput.value) {
        const v = typeInput.value;
        let ms = 0;
        if (v.includes(":")) {
          const parts = v.split(":");
          ms = (parseInt(parts[0]) * 60 + parseFloat(parts[1])) * 1000;
        } else ms = parseFloat(v) * 1000;
        
        addSolve({ ms: Math.round(ms), penalty: null, scramble: scrambleTextEl.textContent, at: new Date().toISOString() });
        typeInput.value = ""; getNewScramble();
      }
    });

    // ==========================================================
    // UI Rendering
    // ==========================================================
    window.solveEffectiveMs = function(s) { return s.penalty === "DNF" ? Infinity : s.penalty === "+2" ? s.ms + 2000 : s.ms; }
    function solveDisplay(s) { if(s.penalty === "DNF") return "DNF"; const b = fmt(s.ms); return s.penalty === "+2" ? b+"+" : b; }

    function addSolve(s) { const ls = loadSolves(); ls.unshift(s); saveSolves(ls); renderSolves(); renderStats(); }
    window.cyclePenalty = function(i) { const ls = loadSolves(); ls[i].penalty = ls[i].penalty === null ? "+2" : ls[i].penalty === "+2" ? "DNF" : null; saveSolves(ls); renderSolves(); renderStats(); }
    window.deleteSolve = function(i) { const ls = loadSolves(); ls.splice(i, 1); saveSolves(ls); renderSolves(); renderStats(); }
    window.shareSolve = function(i) { const s = loadSolves()[i]; openShareModal(`Time: ${solveDisplay(s)}\nScramble: ${s.scramble}`); }

    function renderSolves() {
      const solves = loadSolves();
      const listEl = document.getElementById("solve-list");
      if (!solves.length) { listEl.innerHTML = `<p class="p-4 text-center text-xs text-gray-500">No solves yet.</p>`; return; }
      
      listEl.innerHTML = solves.map((s, i) => {
        const n = solves.length - i;
        const color = s.penalty === "DNF" ? "color:var(--cube-red);" : "color:var(--ink);";
        return `
        <div class="solve-row flex justify-between items-center px-3 py-1.5 border-b border-black/10 hover:bg-black/10 transition-colors group cursor-default text-[0.8rem]">
          <div class="flex items-center w-full">
             <span class="w-6 text-right mr-3" style="color:var(--ink-muted);">${n}.</span>
             <span class="font-bold flex-1" style="${color}">${solveDisplay(s)}</span>
             <div class="solve-actions flex gap-1">
                <button onclick="shareSolve(${i})" class="text-xs px-1.5 py-0.5 rounded bg-blue-900/30 text-blue-300 hover:bg-blue-900/50">📤</button>
                <button onclick="cyclePenalty(${i})" class="text-xs px-1.5 py-0.5 rounded bg-gray-700 text-gray-300 hover:bg-gray-600">+2</button>
                <button onclick="deleteSolve(${i})" class="text-xs px-1.5 py-0.5 rounded bg-red-900/40 text-red-300 hover:bg-red-900/60">X</button>
             </div>
          </div>
        </div>`;
      }).join("");
    }

    function average(msArr) {
      if(!msArr.length) return null;
      if(msArr.filter(v => v === Infinity).length >= 2) return "DNF";
      const t = [...msArr].sort((a,b)=>a-b).slice(1, -1);
      if(t.some(v => v === Infinity)) return "DNF";
      return t.reduce((a,b)=>a+b, 0) / t.length;
    }

    function renderStats() {
      const solves = loadSolves();
      document.getElementById("stat-count").textContent = solves.length;
      const valid = solves.map(solveEffectiveMs).filter(v => v !== Infinity);
      document.getElementById("stat-best").textContent = valid.length ? fmt(Math.min(...valid)) : "—";
      document.getElementById("stat-mean").textContent = valid.length ? fmt(valid.reduce((a,b)=>a+b,0)/valid.length) : "—";

      const html = settings.avgs.map(n => {
        let text = "—";
        if(solves.length >= n) {
          const avg = average(solves.slice(0, n).map(solveEffectiveMs));
          text = avg === "DNF" ? "DNF" : fmt(avg);
        }
        return `<div>Ao${n}: <span class="font-bold text-[var(--ink)]">${text}</span></div>`;
      }).join("");
      document.getElementById("stat-avgs-grid").innerHTML = html;
    }

    document.getElementById("clear-session-btn").addEventListener("click", () => {
      if(confirm("Clear session?")) { saveSolves([]); renderSolves(); renderStats(); }
    });
